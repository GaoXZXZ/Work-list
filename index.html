<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e3036">
  <meta name="description" content="记录工作进展，整理子任务，并在 iPhone 和 Windows 之间加密同步。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Work List</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <div class="app">
    <button id="nav-backdrop" class="nav-backdrop" data-action="nav-close" aria-label="关闭侧栏" hidden></button>
    <aside id="sidebar" class="sidebar" aria-label="时间筛选">
      <a class="brand" href="./">
        <img src="./icon-192.png" width="43" height="43" alt="">
        <span>Work List<small>我的工作台</small></span>
      </a>
      <div class="nav-main">
        <button id="reports-nav" class="nav-item reports-nav" data-action="reports" aria-current="false"><span data-icon="list"></span>工作报表</button>
        <h2>时间筛选</h2>
        <nav id="time-nav"></nav>
        <div id="month-nav"></div>
      </div>
      <div class="nav-bottom">
        <button id="widget-button" class="nav-item" data-action="widget" hidden><span data-icon="widget"></span>桌面组件</button>
        <button class="nav-item" data-action="settings"><span data-icon="settings"></span>设置与同步</button>
        <button id="sync-button" class="sync-badge" data-action="settings" title="打开同步设置"><span class="sync-dot"></span><span id="sync-label">本机保存</span></button>
      </div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <div class="top-title">
          <button class="icon-button menu-button" data-action="nav-open" aria-label="打开侧栏" aria-controls="sidebar"><span data-icon="menu"></span></button>
          <h1 id="page-heading">工作台</h1>
        </div>
        <div id="task-top-actions" class="top-actions">
          <label class="search"><span data-icon="search"></span><input type="search" id="search" placeholder="搜索任务和记录" aria-label="搜索任务和记录"></label>
          <button class="button primary add-button" data-action="add"><span data-icon="plus"></span><span>新建任务</span></button>
        </div>
        <button id="report-back" class="button" data-action="report-back" hidden><span data-icon="back"></span>返回工作台</button>
      </header>
      <div id="task-content" class="content">
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <div id="hero-date" class="hero-date"></div>
            <h2 id="hero-title">我的工作记录</h2>
            <div class="hero-counts">
              <span><strong id="active-count">0</strong> 进行中</span>
              <span><strong id="done-count">0</strong> 已办结</span>
              <span id="late-stat"><strong id="late-count">0</strong> 已逾期</span>
            </div>
          </div>
          <img class="hero-art" src="./cover.png" alt="">
        </section>
        <div class="work-grid" id="work-grid">
          <section class="task-pane" aria-label="任务列表">
            <div class="list-head">
              <div class="tabs" role="group" aria-label="任务状态">
                <button data-action="status" data-value="active" aria-pressed="true">进行中</button>
                <button data-action="status" data-value="done" aria-pressed="false">已办结</button>
              </div>
              <button class="filter-pill" data-action="nav-open" title="打开时间筛选"><span data-icon="calendar"></span><span id="active-filter">全部时间</span></button>
            </div>
            <div id="tasks" class="tasks" aria-live="polite"><p class="loading">正在打开工作记录…</p></div>
          </section>
          <section id="detail" class="detail-pane" aria-label="任务详情"></section>
        </div>
      </div>
      <section id="report-content" class="content reports" aria-labelledby="page-heading" hidden>
        <div class="report-controls">
          <div id="report-kinds" class="tabs" role="group" aria-label="报表周期">
            <button type="button" data-kind="week" aria-pressed="true">周报</button>
            <button type="button" data-kind="month" aria-pressed="false">月报</button>
            <button type="button" data-kind="year" aria-pressed="false">年报</button>
          </div>
          <div class="report-picker">
            <button id="report-previous" type="button" class="icon-button" aria-label="上一期"><span data-icon="back"></span></button>
            <label class="report-date"><span>定位日期</span><input id="report-anchor" type="date" aria-label="选择报表日期"></label>
            <button id="report-next" type="button" class="icon-button report-next" aria-label="下一期"><span data-icon="back"></span></button>
            <button id="report-today" type="button" class="button">本期</button>
          </div>
        </div>
        <div class="report-overview">
          <div class="report-period">
            <h2 id="report-title">工作周报</h2>
            <p id="report-range"></p>
          </div>
          <dl class="report-stats" aria-label="报表统计">
            <div><dt>本期新增</dt><dd id="report-created">0</dd></div>
            <div><dt>本期办结</dt><dd id="report-completed">0</dd></div>
            <div><dt>跟进记录</dt><dd id="report-notes">0</dd></div>
            <div><dt>当前待推进</dt><dd id="report-pending">0</dd></div>
          </dl>
        </div>
        <section id="report-yearly" class="report-panel" hidden aria-labelledby="report-yearly-title">
          <h3 id="report-yearly-title">按月统计</h3>
          <table class="report-table">
            <thead><tr><th scope="col">月份</th><th scope="col">新增</th><th scope="col">办结</th><th scope="col">跟进</th></tr></thead>
            <tbody id="report-months"></tbody>
          </table>
        </section>
        <section class="report-panel" aria-labelledby="report-draft-title">
          <div class="report-panel-heading">
            <div><h3 id="report-draft-title">报表草稿</h3><p>可直接修改，也可用 DeepSeek 整理成汇报文稿。</p></div>
            <button id="report-ai-open" type="button" class="button primary"><span data-icon="sparkles"></span>用 DeepSeek 撰写</button>
          </div>
          <textarea id="report-draft" class="report-text" aria-labelledby="report-draft-title" spellcheck="false"></textarea>
          <div class="report-actions">
            <button id="report-reset" type="button" class="text-button" hidden>恢复自动草稿</button>
            <button id="report-copy" type="button" class="button">复制草稿</button>
            <button id="report-download" type="button" class="button">下载 TXT</button>
          </div>
          <p class="report-hint">编辑保留在当前页面，可复制或下载保存。办结按任务保留的办结时间统计，待推进显示生成时状态。</p>
        </section>
      </section>
    </main>
  </div>
  <dialog id="dialog" class="modal">
    <div id="dialog-content"></div>
  </dialog>
  <dialog id="report-ai-dialog" class="modal report-ai-dialog" aria-labelledby="report-ai-title">
    <div class="modal-header">
      <h2 id="report-ai-title">用 DeepSeek 撰写</h2>
      <button id="report-ai-close" type="button" class="icon-button" aria-label="关闭"><span data-icon="x"></span></button>
    </div>
    <form id="report-ai-form">
      <p class="modal-description">请先检查素材。点击「发送并生成」后，以下正文会发送给 DeepSeek，可以先删除项目名、金额等敏感内容。</p>
      <label class="field"><span>发送素材</span><textarea id="report-ai-material" class="report-text" rows="10" required spellcheck="false"></textarea></label>
      <p id="report-ai-model" class="modal-description" hidden></p>
      <label id="report-ai-code-field" class="field"><span>AI 访问口令</span><input id="report-ai-code" type="password" autocomplete="off" maxlength="512" required></label>
      <p id="report-ai-status" class="form-error" role="status" hidden></p>
      <div class="modal-footer"><button id="report-ai-generate" type="submit" class="button primary">发送并生成</button></div>
    </form>
    <div id="report-ai-preview" hidden>
      <p class="modal-description">查看生成结果，确认后可将它用作当前报表的草稿。</p>
      <label class="field"><span>生成结果</span><textarea id="report-ai-result" class="report-text" rows="12" spellcheck="false"></textarea></label>
      <div class="modal-footer report-ai-footer">
        <button id="report-ai-review" type="button" class="button">返回素材</button>
        <button id="report-ai-apply" type="button" class="button primary">使用此稿</button>
      </div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>请启用 JavaScript 后打开工作记录。</noscript>
</body>
</html>
